name: eden-fresh
title: Eden Fresh
base: core24
adopt-info: eden-app
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]
summary: Eden, Nintendo Switch emulator (latest stable release)
description: |
  Eden is an open-source Nintendo Switch emulator written in C++, derived from
  yuzu and Sudachi.

  This is an unofficial community snap. It repackages the official Linux
  AppImage published by the Eden project (https://git.eden-emu.dev/eden-emu/eden)
  and is rebuilt automatically whenever a new stable upstream release appears.

  No firmware, keys or games are included. You must dump them from your own
  console.

  Nintendo Switch is a trademark of Nintendo. This application is not
  affiliated with Nintendo in any way.
license: GPL-3.0-or-later
website: https://eden-emu.dev
source-code: https://github.com/iampopovich/Snap-Eden-emulator
issues: https://github.com/iampopovich/Snap-Eden-emulator/issues
grade: stable
confinement: strict
compression: lzo
icon: snap/gui/dev.eden_emu.eden.svg

apps:
  eden-fresh:
    command-chain: [bin/desktop-launch-eden]
    # Upstream AppRun: runs the sharun hooks (vulkan checks, X11 fallback) and
    # then the bundled eden binary. Set I_WANT_A_BROKEN_WAYLAND_UI=1 for native
    # Wayland, same as with the upstream AppImage.
    command: opt/eden/AppRun
    desktop: opt/eden/dev.eden_emu.eden.desktop
    common-id: dev.eden_emu.eden
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - audio-playback
      - network
      - network-bind
      - screen-inhibit-control
      - home
      - removable-media
      - mount-observe
      - system-observe
      - hardware-observe
      - joystick
      - bluez
      - udisks2
      - shared-memory

plugs:
  shared-memory:
    private: true

parts:
  eden-app:
    plugin: nil
    build-packages: [curl, jq]
    override-build: |
      set -eu
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64) TARGET=amd64 ;;
        arm64) TARGET=aarch64 ;;
        *) echo "Unsupported arch $CRAFT_ARCH_BUILD_FOR"; exit 1 ;;
      esac

      # Newest non-draft, non-prerelease release from the official Forgejo.
      curl -fsSL "https://git.eden-emu.dev/api/v1/repos/eden-emu/eden/releases?limit=20" -o releases.json
      TAG=$(jq -r '[.[] | select(.draft == false and .prerelease == false)][0].tag_name' releases.json)
      URL=$(jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .assets[].browser_download_url' releases.json \
        | grep -E "/Eden-Linux-${TAG}-${TARGET}-clang-pgo\.AppImage$" | head -1 || true)
      [ -n "$URL" ] || { echo "No ${TARGET} clang-pgo AppImage in ${TAG}"; exit 1; }
      echo "Downloading $URL"
      curl -fL "$URL" -o eden.AppImage
      chmod +x eden.AppImage
      rm -rf squashfs-root AppDir
      ./eden.AppImage --appimage-extract > /dev/null
      # uruntime (DwarFS) AppImages extract to AppDir/ and leave squashfs-root
      # as a symlink to it; older runtimes extract to squashfs-root/.
      if [ -d AppDir ]; then EXTRACTED=$(readlink -f AppDir); else EXTRACTED=$(readlink -f squashfs-root); fi
      [ -x "$EXTRACTED/AppRun" ] || { echo "AppImage extraction failed"; exit 1; }

      mkdir -p "$CRAFT_PART_INSTALL/opt"
      rm -rf "$CRAFT_PART_INSTALL/opt/eden"
      mv "$EXTRACTED" "$CRAFT_PART_INSTALL/opt/eden"

      # No in-place AppImage self-updates inside a snap.
      rm -f "$CRAFT_PART_INSTALL/opt/eden/bin/self-updater.hook"

      DESKTOP="$CRAFT_PART_INSTALL/opt/eden/dev.eden_emu.eden.desktop"
      sed -i \
        -e 's|^Name=Eden$|Name=Eden Fresh|' \
        -e 's|^Icon=.*|Icon=${SNAP}/opt/eden/dev.eden_emu.eden.svg|' \
        -e '/^TryExec=/d' \
        -e '/^X-AppImage-/d' \
        "$DESKTOP"

      craftctl set version="${TAG#v}"

  launcher:
    after: [eden-app]
    plugin: dump
    source: ./other-files
    organize:
      desktop-launch-eden: bin/desktop-launch-eden
    prime: [bin/desktop-launch-eden]
